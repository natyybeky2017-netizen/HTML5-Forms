
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Forms</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main>
        <h1>Survey Form</h1>

        <form id="survey-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="1" required>

            <label for="role">Which best option describes you?</label>
            <select id="role" name="role" required>
                <option value="">Select an option</option>
                <option value="student">Student</option>
                <option value="worker">Worker</option>
                <option value="other">Other</option>
            </select>

            <p>Would you recommend this site?</p>

            <label>
                <input type="radio" name="recommend" value="Yes" required>
                Yes
            </label>

            <label>
                <input type="radio" name="recommend" value="No">
                No
            </label>

            <label>
                <input type="radio" name="recommend" value="Maybe">
                Maybe
            </label>

            <p>Languages and Frameworks known</p>

            <label>
                <input type="checkbox" name="languages" value="HTML">
                HTML
            </label>

            <label>
                <input type="checkbox" name="languages" value="CSS">
                CSS
            </label>

            <label>
                <input type="checkbox" name="languages" value="JavaScript">
                JavaScript
            </label>

            <label>
                <input type="checkbox" name="languages" value="Python">
                Python
            </label>

            <button type="submit">Submit</button>
        </form>
    </main>

</body>
</html>
